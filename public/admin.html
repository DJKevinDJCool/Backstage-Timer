<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin - Backstage Timer</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .admin-panel{max-width:800px;margin:40px auto;background:#111;padding:20px;border-radius:8px;border:1px solid rgba(255,255,255,0.04)}
      label{display:block;margin-top:12px;color:#9fb8c9}
      textarea{width:100%;height:120px;padding:8px;background:#0b0b0b;color:#fff;border:1px solid rgba(255,255,255,0.04);border-radius:6px}
      .row{display:flex;gap:8px;margin-top:12px}
      button{padding:10px 14px;border-radius:6px;border:none;background:#1b8a4a;color:#fff;font-weight:700}
    </style>
  </head>
  <body>
    <!-- Keypad unlock overlay: user must press the code (no typing) -->
    <div id="keypadWrap">
      <div class="keypad">
        <div class="key-display"><span id="keyDots">● ● ● ●</span></div>
        <div class="keys">
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key clear">←</button>
          <button class="key">0</button>
          <button class="key ok">OK</button>
        </div>
        <div class="key-help">Trykk PIN for å åpne adminpanel</div>
      </div>
    </div>

    <div id="adminContent" style="display:none">
      <div class="admin-wrap">
        <header class="admin-header">
          <div class="header-left">
            <div class="title">UKM 2026</div>
          </div>
          <div class="header-right">

          </div>
        </header>

        <div class="admin-main">
          <aside class="left-col">
            <div class="timeline-card">
              <div id="miniProgress" class="mini-progress">
                <div id="miniFill" class="mini-fill"></div>
              </div>
              <div class="timeline-labels">10:00 9:00 8:00 7:00 6:00 5:00 4:00 3:00 2:00 1:00</div>
            </div>

            <div class="clock-card">
              <div class="small-clock" id="nowClockDisplay">--:--:--</div>
              <div class="cue-finish">Cue finish<br><span id="cueFinishTime">--:--:--</span></div>
            </div>
            

            <div class="connections-card">Live Connections <span id="connCount"></span></div>
            <div class="go" id="goButton">
              GO <span id="go-knapp"></span>
            </div>
            <div class="stop" id="stopButton">Stopp</div>
            <div class="fadeall" id="fadeall">Fade All</div>
          </aside>

          <section class="center-col">
            <div class="preview-frame">
              <iframe id="previewFrame" src="/" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
            <div class="center-controls">
              <button id="blackoutBtn" class="control-btn">Blackout</button>
              <button id="flashTimerBtn" class="control-btn">Flash</button>
            </div>
          </section>

          <aside class="right-col">
            <div class="messages-header">
              <div>Messages</div>
              <div class="msg-actions">
       
              </div>
            </div>
            <div id="messagesContainer" style="margin-top:10px;display:flex;flex-direction:column;gap:10px"></div>
            <div id="presetsList" class="presets-list"></div>
            <div class="add-message"><button id="addMessage" class="btn">+ Add Message</button></div>
          </aside>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
